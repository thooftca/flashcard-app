<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastery Cards</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
</head>

<body>

  <div class="app-container">
    <header>
      <div class="header-row">
        <h1>Mastery Cards</h1>
        <div class="score-chip" id="score-chip" style="display: none;">0 / 0</div>
      </div>
      <div class="streak-bar-container" id="streak-bar-container" style="display: none;">
        <div class="streak-bar" id="streak-bar"></div>
        <div class="streak-labels" id="streak-labels"></div>
      </div>
    </header>

    <!-- Deck Selection Menu -->
    <main class="deck-selection" id="deck-selection">
      <h2>Select a Deck</h2>
      <div class="deck-list" id="deck-list">
        <!-- Decks populated by JS -->
        <p style="color: #94a3b8;">Loading decks...</p>
      </div>
    </main>

    <!-- App Core -->
    <div id="app-core" style="display: none;">
      <div class="deck-controls" style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
        <button id="btn-back-to-decks" class="btn level-btn" style="opacity: 1;">&#8592; Change Deck</button>
      </div>

      <main class="flashcard-area">
        <!-- Front (Question) -->
        <div class="card front" id="card-front">
          <div class="card-label">Question</div>
          <div class="card-content" id="card-front-content">
            Loading...
          </div>
        </div>

        <!-- Back (Answer) -->
        <div class="card back hidden" id="card-back">
          <div class="card-label">Answer</div>
          <div class="card-content" id="card-back-content">
            Loading...
          </div>
        </div>
      </main>

      <div class="controls">
        <div id="hint-space" class="key-hint">
          Press <span class="key">Spacebar</span> to flip card
        </div>

        <div id="hint-actions" class="key-hint" style="display: none;">
          Press <span class="key">Enter</span> if you knew it
          <span style="margin: 0 0.5rem; opacity: 0.5;">|</span>
          Press <span class="key">&darr;</span> to review again later
        </div>
      </div>
    </div> <!-- End App Core -->
  </div>

  <div class="completion-screen" id="completion-screen">
    <div class="completion-icon">🎉</div>
    <h2>All Done!</h2>
    <p id="completion-msg"
      style="margin-bottom: 2rem; color: #94a3b8; font-size: 1.1rem; text-align: center; max-width: 400px;">
      You have successfully mastered all cards in this deck.
    </p>
    <button class="btn" id="restart-btn">Study Again</button>
  </div>

  <script src="script.js"></script>
</body>

</html>
